name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -x setup.sh lib/*.sh

      # ventoy/ and themes/ are upstream code, kept exactly as shipped.
      - name: prettier
        run: npx --yes prettier@3.9.9 --check . '!ventoy/**' '!themes/**'
