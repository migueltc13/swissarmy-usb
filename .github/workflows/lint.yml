name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -x setup.sh lib/*.sh share/bash-completion/completions/* .github/scripts/*.sh

      # ventoy/ and themes/ are upstream code, kept exactly as shipped.
      - name: prettier
        run: npx --yes prettier@3.9.9 --check . '!ventoy/**' '!themes/**'

      # Every command and option in --help must be in the man page (roff
      # writes "-" as "\-", so undo that before searching).
      - name: man page covers --help
        shell: bash
        run: |
          man=share/man/man1/swissarmy-usb.1
          text=$(sed 's/\\-/-/g' "$man")
          missing=0
          for word in $(./setup.sh --help | sed -nE 's/^  ([a-z][a-z-]*) .*/\1/p; s/^  ([a-z][a-z-]*)$/\1/p; s/^  (-[a-z]), (--[a-z-]+).*/\1 \2/p; s/^  (--[a-z-]+).*/\1/p'); do
            grep -qF -- "$word" <<<"$text" || { echo "::error::'$word' is in --help but not in $man"; missing=1; }
          done
          exit $missing

      - name: completion answers
        run: .github/scripts/test-completion.sh

      - name: zsh completion parses
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          zsh -n share/zsh/site-functions/_swissarmy-usb
