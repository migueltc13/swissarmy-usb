name: Bug report
description: Something in setup.sh doesn't work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: |
        The command you ran and its full output. Try it with `--dry-run`
        (`-n`) first if it writes to the stick.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Ubuntu version and how the stick is connected.
      placeholder: Ubuntu 24.04, 64 GB SanDisk stick on USB 3
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
