# swissarmy-usb ISO manifest — the single source of truth for what goes on
# the stick. setup.sh reads this to download ISOs and to generate
# ventoy/ventoy.json and Files/isos.md.
#
# [folder:<name>]  a top-level folder on the stick
#   alias    menu name shown by Ventoy (TreeView mode)
#   tip      one-line description shown at the bottom of the menu
#
# [<id>]           one ISO
#   folder   target folder on the stick (must be declared above)
#   file     stable filename on the stick, no version in it
#   alias    menu name shown by Ventoy
#   tip      short description (version and language are added automatically)
#   lang     language(s), optional
#   source   resolver + arguments, see lib/resolvers.sh — or "manual"
#   verify   sha256 | sha256+gpg | none
#   gpg_key  URL of the project's signing key       (verify = sha256+gpg)
#   gpg_fpr  expected fingerprint of that key        (verify = sha256+gpg)
#   pin      optional version pin (resolver-specific, see README)
#   url      manual entries: where to download it by hand
#   match    manual entries: filename glob searched in --from <dir>
#   persistence  optional: label of a persistence image (e.g. "persistence")
#
# Values run to the end of the line; "#" starts a comment only at the start
# of a line.

[folder:1-Installers]
alias = Installers
tip   = Operating system installers

[folder:2-Disk-Tools]
alias = Disk Tools
tip   = Clone, image and partition disks

[folder:3-Rescue]
alias = Rescue
tip   = Repair boot loaders and rescue broken systems

[folder:4-Security]
alias = Security
tip   = Penetration testing, privacy and forensics

[folder:5-Antivirus]
alias = Antivirus
tip   = Offline malware scanners

# --- 1-Installers ----------------------------------------------------------

[archlinux]
folder  = 1-Installers
file    = archlinux.iso
alias   = Arch Linux
tip     = Rolling release installer (archinstall)
lang    = English
source  = arch
verify  = sha256+gpg
gpg_key = https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3E80CA1A8B89F69CBA57D98A76A5EF9054449A5C
gpg_fpr = 3E80CA1A8B89F69CBA57D98A76A5EF9054449A5C

[omarchy]
folder  = 1-Installers
file    = omarchy.iso
alias   = Omarchy
tip     = Arch + Hyprland, opinionated setup by DHH
lang    = English
source  = omarchy
verify  = sha256

[ubuntu]
folder  = 1-Installers
file    = ubuntu-24.04-desktop.iso
alias   = Ubuntu 24.04 LTS Desktop
tip     = Long-term support desktop installer
lang    = Multilingual
source  = ubuntu desktop
pin     = 24.04
verify  = sha256+gpg
gpg_key = https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x843938DF228D22F7B3742BC0D94AA3F0EFE21092
gpg_fpr = 843938DF228D22F7B3742BC0D94AA3F0EFE21092
persistence = casper-rw

[kali-netinst]
folder  = 1-Installers
file    = kali-netinst.iso
alias   = Kali Linux (net installer)
tip     = Minimal installer, fetches packages during install
lang    = Multilingual
source  = kali installer-netinst
verify  = sha256+gpg
gpg_key = https://archive.kali.org/archive-key.asc
gpg_fpr = 827C8569F2518CC677FECA1AED65462EC8D5E4C5

[windows10]
folder  = 1-Installers
file    = windows10.iso
alias   = Windows 10
tip     = Windows 10 22H2 installer
source  = manual
url     = https://www.microsoft.com/software-download/windows10ISO
match   = Win10_*x64*.iso
verify  = none

[windows11]
folder  = 1-Installers
file    = windows11.iso
alias   = Windows 11
tip     = Windows 11 installer
source  = manual
url     = https://www.microsoft.com/software-download/windows11
match   = Win11_*x64*.iso
verify  = none

